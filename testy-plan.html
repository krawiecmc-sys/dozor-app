<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>TEST</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nadzor-plan-area"><main id="plan-content" style="width:1100px"></main></div>
<pre id="wynik">trwa…</pre>
<script type="module">
const log = [];
const ok = (warunek, opis) => log.push(`${warunek ? 'OK  ' : 'BŁĄD'} ${opis}`);
const wynikEl = document.getElementById('wynik');
try {
  // 1) Stara baza w wersji 9 z rekordem — czy aktualizacja do 10 go zachowa?
  await new Promise((res, rej) => {
    const r = indexedDB.open('dozor-baza-wiedzy', 9);
    r.onupgradeneeded = () => {
      const db = r.result;
      db.createObjectStore('wiedza', { keyPath: 'id' }).createIndex('category', 'category');
      db.createObjectStore('meta', { keyPath: 'key' });
      for (const n of ['rozdzielnie','poleRozdzielcze','transformatory','urzadzenia','kb','czujniki','silniki','przegladyBiezace','przegladyOugWug','diagnostykaBaza','diagnostykaAnaliza'])
        db.createObjectStore(n, { keyPath: 'id', autoIncrement: true });
    };
    r.onsuccess = () => {
      const db = r.result;
      const tx = db.transaction('transformatory', 'readwrite');
      tx.objectStore('transformatory').add({ t_nr: 'STARY-T9', t_napiecie: '6/1 kV' });
      tx.oncomplete = () => { db.close(); res(); };
      tx.onerror = () => rej(tx.error);
    };
    r.onerror = () => rej(r.error);
  });

  const db = await import('./js/db.js');
  const t0 = await db.nadzorGetAll('transformatory');
  ok(t0.length === 1 && t0[0].t_nr === 'STARY-T9', 'migracja 9→10: stary transformator zachowany');
  ok(Array.isArray(await db.nadzorGetAll('chodniki')) && Array.isArray(await db.nadzorGetAll('przenosniki')), 'migracja 9→10: nowe magazyny chodniki i przenosniki istnieją');

  // 2) Plan rejonu z przykładowego rejonu
  const { createPlanView } = await import('./js/plan-view.js');
  const plan = createPlanView('plan-content');
  await plan.init({});
  await plan._test.wczytajPrzyklad();
  await plan.init({});
  const svg = document.getElementById('plan-svg');
  const n = (sel) => svg.querySelectorAll(sel).length;
  ok(n('[data-chodnik]') === 5, `5 chodników narysowanych (jest ${n('[data-chodnik]')})`);
  ok(n('[data-obiekt^="przenosniki:"]') === 5, `5 napędów (jest ${n('[data-obiekt^="przenosniki:"]')})`);
  ok(n('[data-obiekt^="urzadzenia:"]') === 8, `8 urządzeń (jest ${n('[data-obiekt^="urzadzenia:"]')})`);
  ok(n('[data-obiekt^="transformatory:"]') === 3 - 1, `2 transformatory na planie, stary bez położenia (jest ${n('[data-obiekt^="transformatory:"]')})`);
  ok(n('[data-obiekt^="kb:"]') === 1 && n('[data-obiekt^="rozdzielnie:"]') === 1 && n('[data-obiekt^="poleRozdzielcze:"]') === 2, 'kombajn, rozdzielnia i 2 pola');
  const kable = n('[data-kabel]');
  ok(kable === 16, `16 kabli (2 SN + 14 nn) narysowanych (jest ${kable})`);
  const teksty = [...svg.querySelectorAll('text')].map((t) => t.textContent);
  ok(teksty.includes('Mifama1100 1.5') && teksty.includes('R-650') && teksty.includes('AM-1'), 'opisy: Mifama1100 1.5, R-650, AM-1');
  ok(teksty.some((t) => t === '6 kV · K2 3x50 690 m'), 'opis kabla: znacznik napięcia + K2 3x50 690 m');
  const zOpisem = teksty.filter((t) => / kV · K\d+ /.test(t)).length;
  ok(zOpisem === 13, `13 kabli ze znacznikiem napięcia i opisem, 3 bez opisu (jest ${zOpisem})`);
  const braki = document.getElementById('plan-braki').textContent;
  ok(braki.includes('Bez położenia na planie (1)') && braki.includes('Połączenia bez opisu kabla (3)'), 'lista braków: 1 bez położenia (STARY-T9), 3 bez kabla');
  // 2b) Układ zasilania (03.11.2026): pole -> trafo / pole, trafo -> wyłącznik, wyłącznik -> odbiorniki
  const T = plan._test;
  const zr = (r) => T.zrodlaDla(r).map((o) => o.wartosc.split('|')[1]);
  ok(zr('odbiornik').length > 0 && !zr('odbiornik').includes('transformatory'), 'odbiornik: z wyłącznika (albo pompa 6 kV z pola), nie z transformatora');
  ok(zr('kb').length === 7 && zr('kb').every((x) => x === 'urzadzenia'), `kombajn: 7 wyłączników jako źródło, bez transformatora i odbiornika HMC (jest ${zr('kb').length})`);
  ok(zr('przenosniki').every((x) => x === 'urzadzenia'), 'napęd przenośnika: tylko z wyłącznika');
  ok(zr('transformatory').filter((x) => x === 'poleRozdzielcze').length === 2 && zr('transformatory').includes('transformatory') && zr('poleRozdzielcze').length === 2 && zr('rozdzielnie').length === 2, 'transformator: z pola albo z przelotu 6 kV transformatora; pole i rozdzielnia: z pola');
  const odpTr = T.odplywyDla('transformatory').map((o) => o.wartosc.split('|')[0]);
  ok(odpTr.filter((x) => x === 'urzadzenia').length === 7 && odpTr.includes('transformatory') && !odpTr.includes('kb') && !odpTr.includes('przenosniki'), 'transformator: odpływ do wyłączników (7) i przelotem do transformatorów, nie do kombajnu ani napędu');
  const odpPola = T.odplywyDla('poleRozdzielcze').map((o) => o.wartosc.split('|')[0]);
  ok(odpPola.includes('transformatory') && odpPola.includes('poleRozdzielcze') && !odpPola.includes('kb') && !odpPola.includes('przenosniki'), 'pole: odpływ do transformatora, pola (przelot), rzadko aparatu 6 kV; nie do kombajnu ani napędu');
  ok(T.odplywyDla('odbiornik').length === 0, 'odbiornik nie zasila niczego');
  ok(!document.getElementById('plan-braki').textContent.includes('niezgodne'), 'przykład bez połączeń niezgodnych z układem');
  // NaN w geometrii?
  ok(!svg.innerHTML.includes('NaN'), 'brak NaN w rysunku');

  // 3) Zachowanie pól spoza formularza przy edycji (crud) — symulacja: nadzorUpdate z {...record, ...newRecord}
  const u = (await db.nadzorGetAll('urzadzenia'))[0];
  await db.nadzorUpdate('urzadzenia', { ...u, plan_dx: 12, plan_dy: -7 });

  // 4) Import z Excela
  const imp = await import('./js/import-excel.js');
  const nrKop = imp.nrKop;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = './js/vendor/xlsx.full.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const aoa = [
    ['Wykaz transformatorów — oddział G-1'],
    [],
    ['Lp.', 'Nr fabryczny', 'Nr transformatora', 'Typ', 'Moc [kVA]', 'Napięcie', 'Rok produkcji', 'Data badania', 'Miejsce zabudowy'],
    [1, 'F-1001', 'It3sb 340', 'IT3Sb', 630, '6/1 kV', 2015, new Date('2026-03-14'), 'chodnik 1'],
    [2, 'F-1002', 'Mar 439', 'MAR', '1000', '6/1,2 kV', 2018, new Date('2025-11-02'), 'chodnik 4'],
    [3, 'F-1003', 'T-NOWY 1', 'IT3Sb', 400, '6/0,5 kV', 2020, '', ''],
    [4, 'F-1004', '', 'IT3Sb', 400, '', '', '', ''],
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa, { cellDates: true }), 'Arkusz1');
  const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  const wb2 = XLSX.read(buf, { type: 'array', cellDates: true });
  const wiersze = XLSX.utils.sheet_to_json(wb2.Sheets.Arkusz1, { header: 1, raw: true, defval: '' });
  const wn = imp.zgadnijWierszNaglowka(wiersze);
  ok(wn === 2, `wiersz nagłówka zgadnięty: ${wn + 1} (Excel)`);
  const mapa = imp.zgadnijMapowanie(wiersze[wn].map(String));
  ok(mapa.t_nr === 2 && mapa.t_nr_fabryczny === 1 && mapa.t_moc === 4 && mapa.t_napiecie === 5 && mapa.t_rok === 6 && mapa.t_data_badania === 7 && mapa.t_typ === 3 && mapa.t_miejsce_opis === 8, `mapowanie kolumn: ${JSON.stringify(mapa)}`);
  const { rekordy, bezNumeru } = imp.zbudujRekordy(wiersze.slice(wn + 1), mapa);
  ok(rekordy.length === 3 && bezNumeru === 1, `3 rekordy, 1 pominięty bez numeru (${rekordy.length}/${bezNumeru})`);
  ok(rekordy[0].t_data_badania === '2026-03-14', `data z Excela: ${rekordy[0].t_data_badania}`);
  const w1 = await imp.importuj(rekordy);
  ok(w1.dodane === 1 && w1.zaktualizowane === 2, `import 1: dodane ${w1.dodane}, zaktualizowane ${w1.zaktualizowane}`);
  const w2 = await imp.importuj(rekordy);
  ok(w2.dodane === 0 && w2.zaktualizowane === 3, `import 2 (ten sam plik): dodane ${w2.dodane}, zaktualizowane ${w2.zaktualizowane} — bez duplikatów`);
  const tr = await db.nadzorGetAll('transformatory');
  const mar = tr.find((t) => t.t_nr === 'Mar 439');
  ok(tr.length === 4, `transformatorów w bazie: ${tr.length} (stary + 2 przykładowe + 1 nowy)`);
  ok(mar && mar.lok_chodnik && mar.kabel_nr === 'K2' && mar.t_moc === 1000 && mar.t_napiecie === '6/1,2 kV' && mar.zrodlo_danych === 'Excel', 'aktualizacja z Excela zachowała położenie i kabel, dopisała moc i napięcie');

  // 4b) Wykaz blokowy "Zabezpieczenia trafo" (dane zmyślone, układ jak w pliku)
  const blok = [
    ['GR-1'], ['TX-1'], ['ZAB-A', 'nr 1/2020', new Date(2020, 0, 15), '220/800A', '', 'UPL-5', 'nr 7', new Date(2020, 1, 3), ''],
    [], ['TX-2'], ['ZAB-A'], [], ['TX-3'], ['ZAB-A', '', new Date(2021, 4, 1), '346/1600A'],
    [], ['GR-2'], ['It3sb 340'], ['', 'nr', '', '', '', 'UPL-10', 'nr 9', new Date(2022, 2, 2), ''], ['', '', '', '????'],
  ];
  ok(imp.wygladaNaWykazBlokowy(blok), 'wykaz blokowy rozpoznany');
  const pw = imp.parsujWykazBlokowy(blok);
  ok(pw.rekordy.length === 4 && pw.rekordy.map((r) => r.t_rejon).join(',') === 'GR-1,GR-1,GR-1,GR-2', `4 transformatory w grupach GR-1/GR-2 (${pw.rekordy.map((r) => r.t_nr + ':' + r.t_rejon).join(' ')})`);
  ok(pw.rekordy[1].t_nr === 'TX-2' && pw.rekordy[1].nastawy_zabezpieczen.length === 1, 'wiersz z samym typem "ZAB-A" to zabezpieczenie, nie grupa');
  ok(pw.rekordy[0].nastawy_zabezpieczen[0].nr === '1/2020' && pw.rekordy[0].nastawy_zabezpieczen[0].legalizacja === '2020-01-15' && pw.rekordy[0].nastawy_zabezpieczen[1].nazwa === 'UPL-5', 'zabezpieczenie: nr bez "nr", data, drugie zabezpieczenie z kol. F');
  const wb3 = await imp.importuj(pw.rekordy);
  const it = (await db.nadzorGetAll('transformatory')).find((t) => t.t_nr === 'It3sb 340');
  ok(wb3.zaktualizowane === 1 && it.lok_chodnik && it.t_rejon === 'GR-2' && it.nastawy_zabezpieczen.length === 1 && it.nastawy_zabezpieczen[0].nazwa === 'UPL-10', 'wykaz zaktualizował istniejący It3sb 340 (położenie zostało, doszły zabezpieczenia i grupa)');
  await imp.importuj(pw.rekordy);
  const it2 = (await db.nadzorGetAll('transformatory')).find((t) => t.t_nr === 'It3sb 340');
  ok(it2.nastawy_zabezpieczen.length === 1, 'ponowny import wykazu nie dubluje zabezpieczeń');

  // 5) Plan po imporcie + usunięcie przykładu
  await plan.init({});
  ok(!svg.innerHTML.includes('NaN'), 'plan po imporcie bez NaN');
  const wynikRys = plan._test.rysuj();
  ok(wynikRys.kable.length === 16, "połączenia po imporcie nadal 16");
  // 6) Schemat rozdzielni (dane zmyślone, układ jak w "Całość rozdzielni") + wykaz stacji po nr kopalnianym
  const S = await import('./js/import-schemat.js');
  const ark1 = [
    ['Rozdzielnia:', 'R-10'],
    ['Pole:', '1', '2', '3', '4'],
    ['Odpływy:', 'R-20 p.1', 'IT3Sb-400/6/0,5', 'pompa odwodn.', 'R-9 p.3'],
    ['', '', 'nr 901', 'nr 1a', ''],
    ['', '', '440 / 2500 A', '', ''],
    ['', '', 'IT3Sd 400/6/1', '', ''],
    ['', '', 'nr 902', '', ''],
    [],
    ['Rozdzielnia:', 'R-10'],
    ['5', '6'],
    ['R-9 p.4', 'APST-250'],
    ['', 'nr 7'],
    ['', 'IT3Sb 400/6/0,5'],
    ['', 'nr 903'],
    [],
    ['Rozdzielnia:', 'R-20', '', '', 'Rozdzielnia:', 'ZR-30'],
    ['Pole:', '1', '2', '3', 'Pole:', 'zasilanie', '1'],
    ['Odpływy:', 'R-10 p.1', 'R-10 p.9', 'ZR-30', 'Odpływy:', 'R-20 p.3', 'ITp 400/6/0,5'],
    ['', '', '', '', '', '', 'nr 904'],
  ];
  const ark2 = [['Rozdzielnia:', 'R-10'], ['Pole:', '2'], ['Odpływy:', 'IT3Sb-400/6/0,5'], ['', 'nr 999']];
  ok(S.wygladaNaSchematRozdzielni(ark1) && !S.wygladaNaSchematRozdzielni(aoa), 'schemat rozdzielni rozpoznany (a zwykła tabela nie)');
  const model = S.parsujSchemat([ark1, ark2]);
  const sm = S.podsumujSchemat(model);
  ok(sm.rozdzielnie === 3 && sm.transformatory === 4 && sm.aparaty === 1 && sm.pompy === 1, `schemat: 3 rozdzielnie, 4 transformatory, 1 aparat, 1 pompa (${JSON.stringify(sm)})`);
  const R10 = model.rozdzielnie.get('R-10');
  const R20 = model.rozdzielnie.get('R-20');
  ok(R10.pola.size === 6, `kontynuacja bloku bez "Pole:" wczytana: R-10 ma 6 pól (${R10.pola.size})`);
  ok(R10.pola.get('4').zrodlo?.zewnetrzne && R10.pola.get('5').zrodlo?.zewnetrzne && R10.pola.get('1').odplywDo === 'R-20 p.1', 'R-10: dwa pola zasilające z R-9 (spoza pliku), pole 1 to odpływ do R-20');
  ok(R20.pola.get('1').zrodlo?.poleKlucz === '1' && R20.pola.get('1').zrodlo.rozdz === 'R-10', 'R-20 pole 1 zasilane z R-10 pole 1 (kierunek od źródła w głąb)');
  ok(model.rozdzielnie.get('ZR-30').pola.get('ZASILANIE').zrodlo?.poleKlucz === '3', 'pole nazwane "zasilanie" w ZR-30 zasilane z R-20 pole 3');
  ok(R10.pola.get('2').uwagi.some((u) => u.startsWith('inny arkusz')), 'to samo pole inaczej w drugim arkuszu: zostaje pierwszy wpis, drugi w uwagach');
  const w6 = await S.importujSchemat(model);
  const tr6 = await db.nadzorGetAll('transformatory');
  const pola6 = await db.nadzorGetAll('poleRozdzielcze');
  const urz6 = await db.nadzorGetAll('urzadzenia');
  const t = (k) => tr6.find((x) => x.t_nr_kop === k);
  const pole = (n) => pola6.find((x) => x.p_nazwa === n);
  const apst = urz6.find((u) => u.nazwa === 'APST-250 nr 7');
  ok(t('901')?.zasilany_z_pola === pole('R-10 pole 2')?.id && t('902')?.zasilany_z_transformatora === t('901').id, 'łańcuch: pole → transformator 901 → przelot 6 kV → 902');
  ok(t('901').t_nastawa_zabezpieczen === '440 / 2500 A' && t('901').t_napiecie === '6/0,5 kV' && t('901').t_moc === 400 && t('902').t_napiecie === '6/1 kV', 'nastawa, napięcie i moc z typu');
  ok(apst?.zasilane_z_pola === pole('R-10 pole 6')?.id && t('903')?.zasilany_z_urzadzenia === apst.id && apst.nap_zas === '6 kV', 'aparat 6 kV APST z pola, transformator 903 z aparatu');
  ok(urz6.some((u) => u.nazwa.startsWith('Pompa odwadniania nr 1a') && u.u_rodzaj.startsWith('odbiornik') && u.zasilane_z_pola === pole('R-10 pole 3').id), 'pompa 6 kV jako odbiornik z pola');
  ok(pole('R-20 pole 1')?.zasilane_z_pola === pole('R-10 pole 1')?.id && pole('R-10 pole 4')?.zasilane_z_pola === 'R-9 p.3', 'przeloty: R-20 p.1 z R-10 p.1; R-10 p.4 z R-9 p.3 (spoza bazy, tekst)');
  ok(/zasilające \(główne\)/.test(pole('R-10 pole 4').p_przeznaczenie) && /odpływ do R-20 p\.1/.test(pole('R-10 pole 1').p_przeznaczenie), 'przeznaczenie pól: zasilające (główne), odpływ do …');
  const w6b = await S.importujSchemat(S.parsujSchemat([ark1, ark2]));
  ok(w6.transformatory[0] === 4 && w6b.transformatory[0] === 0 && w6b.pola[0] === 0 && w6b.rozdzielnie[0] === 0, `ponowny import schematu nie dubluje (${JSON.stringify(w6b)})`);
  const stacje = [
    ['', '2024-09-01', '', 'Stacje Transformatorowe'],
    [],
    ['L.p.', 'Nr inw', 'TYP Transformatora', 'Moc [kVA]', 'Napięcie [V]', 'Numer Ewid', 'Numer fabryczny', 'Numer kop', 'Dokumentacja', 'UWAGI', 'Rok prod.', 'Stan'],
    [1, '1-000-1', 'IT3SB 400/6/05', 400, 500, 'X1', 'F-901', 901, 'OPINIA', '', 1987, 'na stanie'],
    [2, '1-000-2', 'IT3SB 630/6/1N', 630, 1000, 'X2', 'F-905', 905, 'OPINIA', '', 1974, 'Likwidacja'],
  ];
  const wn6 = imp.zgadnijWierszNaglowka(stacje);
  const mapa6 = imp.zgadnijMapowanie(stacje[wn6].map(String));
  ok(wn6 === 2 && mapa6.t_nr_kop === 7 && mapa6.t_nr_inw === 1 && mapa6.t_nr_ewid === 5 && mapa6.t_stan === 11 && mapa6.t_nr === undefined, `wykaz stacji: kolumny nr kop / inw / ewid / stan (${JSON.stringify(mapa6)})`);
  const zb6 = imp.zbudujRekordy(stacje.slice(wn6 + 1), mapa6);
  ok(zb6.rekordy.length === 1 && zb6.pominieteStan === 1 && zb6.rekordy[0].t_nr === 'IT3SB-901' && zb6.rekordy[0].t_napiecie === '6/0,5 kV', 'wykaz stacji: nr z kopalnianego, napięcie z [V], zlikwidowane pominięte');
  const wi6 = await imp.importuj(zb6.rekordy);
  const po6 = (await db.nadzorGetAll('transformatory')).filter((x) => nrKop(x) === '901');
  ok(wi6.zaktualizowane === 1 && po6.length === 1 && po6[0].t_nr_inw === '1-000-1' && po6[0].zasilany_z_pola, 'wykaz stacji dopasowany po nr kopalnianym do transformatora ze schematu (bez duplikatu, połączenie zostało)');
  ok(imp.nrKop({ t_nr: 'MAR-123' }) === '123' && imp.nrKop({ t_nr: 'IT3Sb-456/1' }) === '456' && imp.nrKop({ t_nr: 'STGCA nr 78' }) === '78' && imp.nrKop({ t_nr: 'STARY-T9' }) === '', 'nr kopalniany z nazw: MAR-123, IT3Sb-456/1, STGCA nr 78');
  await plan.init({});
  ok(!svg.innerHTML.includes('NaN'), 'plan po imporcie schematu bez NaN');
  // 7) Synchronizacja: eksport -> import przepina powiązania na nowe id (03.11.2026)
  const { NADZOR_ENTITIES } = await import('./js/nadzor-entities.js');
  const eksp = await db.exportAllData('test');
  const przed = (await db.nadzorGetAll('poleRozdzielcze')).length;
  const wImp = await db.importAllData(eksp, NADZOR_ENTITIES);
  const pola7 = await db.nadzorGetAll('poleRozdzielcze');
  const tr7 = await db.nadzorGetAll('transformatory');
  const kopie = (n) => pola7.filter((x) => x.p_nazwa === n).sort((x, y) => x.id - y.id);
  const [r20a, r20b] = kopie('R-20 pole 1');
  const [r10a, r10b] = kopie('R-10 pole 1');
  const t901 = tr7.filter((x) => x.t_nr_kop === '901').sort((x, y) => x.id - y.id);
  const t902 = tr7.filter((x) => x.t_nr_kop === '902').sort((x, y) => x.id - y.id);
  const r10p2 = kopie('R-10 pole 2');
  ok(pola7.length === 2 * przed && r20b && r20a.zasilane_z_pola === r10a.id && r20b.zasilane_z_pola === r10b.id, 'import kopii: przelot w kopii wskazuje kopię pola, oryginał bez zmian');
  ok(t902[1].zasilany_z_transformatora === t901[1].id && t901[1].zasilany_z_pola === r10p2[1].id && r10p2[1].miejsce_zabudowy !== r10p2[0].miejsce_zabudowy, 'import kopii: łańcuch trafo i miejsce zabudowy pola przepięte na kopie');
  ok(wImp.przepietePowiazania > 0 && kopie('R-10 pole 4')[1].zasilane_z_pola === 'R-9 p.3', `import kopii: ${wImp.przepietePowiazania} powiązań przepiętych, wpis tekstowy spoza bazy bez zmian`);
  window.__gotowe = true;
} catch (e) {
  log.push('WYJĄTEK ' + (e && e.stack || e));
}
wynikEl.textContent = log.join('\n');
document.title = log.some((l) => !l.startsWith('OK')) ? 'BLEDY' : 'WSZYSTKO-OK';
</script>
</body>
</html>
